name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Install locked validation tools
        run: |
          python -m pip install uv==0.12.19
          uv sync --locked
      - name: Validate every skill with skills-ref
        run: uv run --locked bash scripts/validate-skills.sh
      - name: Check repository integrity
        run: uv run --locked python scripts/check-repository.py
      - name: Test utility behavior
        run: uv run --locked python -m unittest discover -s tests -v
      - name: Lint Python
        run: uv run --locked ruff check .
      - name: Check Python formatting
        run: uv run --locked ruff format --check .
      - name: Check shell syntax
        run: |
          bash -n scripts/install-skills.sh
          bash -n scripts/validate-skills.sh
      - name: Check JavaScript syntax
        run: node --check skills/social-post/scripts/count-x.cjs
