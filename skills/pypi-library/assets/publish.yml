name: Publish PyPI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - run: python -m pip install uv==0.12.19
      - run: uv sync --locked --group release
      - name: Verify release version
        run: uv run --locked python -c 'import os, pathlib, tomllib; project = tomllib.loads(pathlib.Path("pyproject.toml").read_text()); assert os.environ["GITHUB_REF_NAME"] == "v" + project["project"]["version"]'
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked python -m unittest discover -s tests -v
      - run: uv run --locked --group release python -m build
      - run: uv run --locked --group release python -m twine check --strict dist/*
      - name: Test both distributions
        shell: bash
        run: |
          set -euo pipefail
          wheels=(dist/*.whl)
          sources=(dist/*.tar.gz)
          test "${#wheels[@]}" -eq 1
          test "${#sources[@]}" -eq 1
          uv run --locked python tests/smoke-distribution.py "${wheels[0]}"
          uv run --locked python tests/smoke-distribution.py "${sources[0]}"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: python-release
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: python-release
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
